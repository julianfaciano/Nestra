[package]
name = "nestra"
version = "0.1.0"
description = "Preparación y distribución de artes textiles offline"
edition = "2021"

[lib]
name = "nestra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
png = "0.18.1"
pdf-writer = "=0.15.0"
flate2 = "=1.1.10"
tempfile = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
skia-safe = "0.99.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
